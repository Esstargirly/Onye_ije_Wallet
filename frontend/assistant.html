<script>
        if (!getToken()) {
            window.location.href = 'login.html';
        }

        const chatMessages = document.getElementById('chat-messages');
        const welcomeSection = document.getElementById('welcome-section');
        const typingIndicator = document.getElementById('typing-indicator');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatCanvas = document.querySelector('main');

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function addMessage(role, text) {
            // First real message hides the static welcome illustration,
            // same idea as most chat apps once a conversation starts.
            welcomeSection.classList.add('hidden');

            const wrapper = document.createElement('div');
            if (role === 'user') {
                wrapper.className = 'flex justify-end items-end gap-2 ml-auto max-w-[85%]';
                wrapper.innerHTML = `
                    <div class="bubble-user bg-[#0C712E] text-white p-4 shadow-sm">
                        <p class="text-body-md">${escapeHtml(text)}</p>
                    </div>
                `;
            } else {
                wrapper.className = 'flex justify-start items-end gap-2 max-w-[85%]';
                wrapper.innerHTML = `
                    <div class="bubble-assistant bg-tertiary-fixed text-on-tertiary-container p-4 shadow-sm">
                        <p class="text-body-md">${escapeHtml(text)}</p>
                    </div>
                `;
            }
            chatMessages.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatCanvas.scrollTop = chatCanvas.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text.trim()) return;

            addMessage('user', text);
            chatInput.value = '';
            typingIndicator.classList.remove('hidden');
            scrollToBottom();
            sendBtn.disabled = true;

            try {
                const data = await apiPost('/assistant', { message: text });
                typingIndicator.classList.add('hidden');
                addMessage('assistant', data.reply);
            } catch (err) {
                typingIndicator.classList.add('hidden');
                addMessage('assistant', "Sorry, I couldn't process that — please try again.");
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', () => sendMessage(chatInput.value));

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== '') {
                sendMessage(chatInput.value);
            }
        });

        document.querySelectorAll('#suggestion-chips button').forEach(btn => {
            btn.addEventListener('click', () => {
                sendMessage(btn.dataset.suggestion);
            });
        });

        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            clearToken();
            window.location.href = 'login.html';
        });

        // Horizontal scroll with wheel for suggestion chips
        const scrollContainer = document.getElementById('suggestion-chips');
        scrollContainer?.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });
    </script>
