<script>
        if (!getToken()) {
            window.location.href = 'login.html';
        }

        let allTransactions = [];
        let activeFilter = 'all';

        function formatNaira(amount) {
            return '\u20a6' + Number(amount).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function groupLabel(date) {
            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);

            const isSameDay = (a, b) =>
                a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

            if (isSameDay(date, today)) return 'Today';
            if (isSameDay(date, yesterday)) return 'Yesterday';
            return 'Earlier';
        }

        function renderTransactions() {
            const container = document.getElementById('transactions-container');
            const filtered = activeFilter === 'all'
                ? allTransactions
                : allTransactions.filter(t => t.type === activeFilter);

            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-on-surface-variant text-body-md text-center py-8">No transactions in this view yet.</p>';
                return;
            }

            // Group by Today / Yesterday / Earlier, preserving original order (newest first)
            const groups = { Today: [], Yesterday: [], Earlier: [] };
            filtered.forEach(t => {
                const label = groupLabel(new Date(t.created_at));
                groups[label].push(t);
            });

            let html = '';
            for (const label of ['Today', 'Yesterday', 'Earlier']) {
                if (groups[label].length === 0) continue;
                html += `<div class="space-y-3">
                    <h2 class="font-label-sm text-label-sm text-outline uppercase tracking-wider">${label}</h2>`;
                groups[label].forEach(t => {
                    const isTopUp = t.type === 'top_up';
                    const icon = isTopUp ? 'north_east' : 'south_west';
                    const iconClasses = isTopUp
                        ? 'bg-primary-container/20 text-primary'
                        : 'bg-surface-variant text-on-surface-variant';
                    const amountClass = isTopUp ? 'text-primary' : 'text-on-surface-variant';
                    const sign = isTopUp ? '+' : '-';
                    const timeStr = new Date(t.created_at).toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div class="transaction-item bg-surface-container-lowest p-4 rounded-xl flex items-center justify-between shadow-[0_4px_12px_0_rgba(0,0,0,0.06)]">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full ${iconClasses} flex items-center justify-center">
                                    <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">${icon}</span>
                                </div>
                                <div>
                                    <p class="font-label-md text-label-md text-on-surface">${t.description || (isTopUp ? 'Wallet Top-up' : 'Fare Deduction')}</p>
                                    <p class="font-label-sm text-label-sm text-on-surface-variant">${timeStr}</p>
                                </div>
                            </div>
                            <span class="font-headline-md text-headline-md ${amountClass}">${sign}${formatNaira(t.amount)}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function updateMonthlySpending() {
            const now = new Date();
            const thisMonthFares = allTransactions.filter(t => {
                const d = new Date(t.created_at);
                return t.type === 'fare_deduction' && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            const total = thisMonthFares.reduce((sum, t) => sum + Number(t.amount), 0);
            document.getElementById('monthly-spending').textContent = formatNaira(total);
        }

        async function loadData() {
            try {
                const [balanceData, historyData] = await Promise.all([
                    apiGet('/wallet/balance'),
                    apiGet('/wallet/history'),
                ]);
                document.getElementById('total-balance').textContent = formatNaira(balanceData.balance);
                allTransactions = historyData;
                updateMonthlySpending();
                renderTransactions();
            } catch (err) {
                clearToken();
                window.location.href = 'login.html';
            }
        }

        document.querySelectorAll('#filter-chips button').forEach(btn => {
            btn.addEventListener('click', () => {
                activeFilter = btn.dataset.filter;
                document.querySelectorAll('#filter-chips button').forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary');
                    b.classList.add('bg-surface-container', 'text-on-surface-variant');
                });
                btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
                btn.classList.add('bg-primary', 'text-on-primary');
                renderTransactions();
            });
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            if (allTransactions.length === 0) {
                alert('No transactions to export yet.');
                return;
            }
            const rows = [['Date', 'Type', 'Description', 'Amount (NGN)']];
            allTransactions.forEach(t => {
                rows.push([t.created_at, t.type, t.description || '', t.amount]);
            });
            const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'onye-ije-wallet-statement.csv';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            clearToken();
            window.location.href = 'login.html';
        });

        loadData();
    </script>
