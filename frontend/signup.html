    // Toggle Password Visibility
    const passToggle = document.getElementById('toggle-password');
    const passInput = document.getElementById('password');
    passToggle.addEventListener('click', () => {
        const icon = passToggle.querySelector('.material-symbols-outlined');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            passInput.type = 'password';
            icon.textContent = 'visibility';
        }
    });

    // Real signup submission
    const form = document.getElementById('signup-form');
    const errorBox = document.getElementById('error-box');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitText.textContent = 'Creating account...';

        try {
            const data = await apiPost('/auth/register', {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
            });
            // Registration doesn't return a token, so log the user in
            // immediately using the same credentials they just submitted.
            const loginData = await apiPost('/auth/login', {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            });
            setToken(loginData.token);
            window.location.href = 'dashboard.html';
        } catch (err) {
            errorText.textContent = err.message;
            errorBox.classList.remove('hidden');
            submitBtn.disabled = false;
            submitText.textContent = 'Create Account';
        }
    });
</script>
