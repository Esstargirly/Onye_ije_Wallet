<body class="min-h-screen flex flex-col justify-center items-center px-margin-mobile">

<p class="font-body-md text-body-md text-on-surface-variant mt-1">Your transit card, in your pocket.</p>

<!-- Login Form Card -->
<div class="w-full login-card rounded-xl p-8 mb-stack-md">
<!-- Error Message (hidden by default) -->
<div class="mb-stack-md px-4 py-3 rounded-lg bg-error-container hidden" id="error-box">
<p class="text-error text-body-md" id="error-text"></p>

<form class="space-y-stack-md" id="loginForm">
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border-0 bg-surface-container-low focus:ring-2 focus:ring-primary text-body-md transition-all outline-none" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-10 py-3 rounded-lg border-0 bg-surface-container-low focus:ring-2 focus:ring-primary text-body-md transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 text-outline-variant hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary-container text-on-primary-container h-14 rounded-xl font-label-md text-label-md flex items-center justify-center gap-2 btn-hover-effect transition-all hover:opacity-90 active:scale-95 mt-4" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>

<p class="font-body-md text-body-md text-on-surface-variant">
                New here? 
                <a class="text-primary font-bold hover:underline ml-1" href="signup.html">Create an account.</a>
</p>
</div>

<!-- Shared API helper -->
<script src="js/api.js"></script>
<!-- Script for simple micro-interactions + real login -->
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        const errorBox = document.getElementById('error-box');
        const errorText = document.getElementById('error-text');

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            errorBox.classList.add('hidden');

            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;

            // Show loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Logging in...';

            try {
                const data = await apiPost('/auth/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                });
                setToken(data.token);

                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                btn.classList.replace('bg-primary-container', 'bg-secondary');
                btn.classList.replace('text-on-primary-container', 'text-white');

                window.location.href = 'dashboard.html';
            } catch (err) {
                errorText.textContent = err.message === 'Invalid credentials'
                    ? 'Incorrect email or password. Please try again.'
                    : err.message;
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        });
    </script>
